<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — PrivateNet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #F9FAFB;
            --card-bg: #FFFFFF;
            --border: #E5E7EB;
            --border-strong: #D1D5DB;
            --text-primary: #111827;
            --text-secondary: #4B5563;
            --text-muted: #9CA3AF;
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --accent-soft: #EFF6FF;
            --success: #059669;
            --success-soft: #ECFDF5;
            --danger: #DC2626;
            --input-bg: #FFFFFF;
            --input-focus: #2563EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            font-size: 14px;
            line-height: 1.5;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 14px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: var(--text-primary);
            color: white;
            display: grid;
            place-items: center;
        }

        .brand-logo svg {
            width: 16px;
            height: 16px;
        }

        .brand-text {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-name {
            font-weight: 600;
            font-size: 14px;
            letter-spacing: -0.01em;
        }

        .brand-tag {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 4px;
            background: #F3F4F6;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
        }

        .topbar-link {
            font-size: 13.5px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
        }

        .topbar-link:hover {
            color: var(--text-primary);
        }

        /* ---------- Main ---------- */
        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .login-wrap {
            width: 100%;
            max-width: 400px;
        }

        /* ---------- Header ---------- */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--accent-soft);
            color: var(--accent);
            display: grid;
            place-items: center;
            margin: 0 auto 16px;
        }

        .login-icon svg {
            width: 22px;
            height: 22px;
        }

        .login-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .login-subtitle {
            font-size: 13.5px;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* ---------- Card ---------- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px 24px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .field-hint {
            font-size: 12.5px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .field-hint:hover {
            text-decoration: underline;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-icon svg {
            width: 16px;
            height: 16px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-primary);
            background: var(--input-bg);
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            padding: 10px 12px 10px 38px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .input-suffix {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            display: flex;
            align-items: center;
            border-radius: 4px;
        }

        .input-suffix:hover {
            color: var(--text-primary);
            background: #F3F4F6;
        }

        .input-suffix svg {
            width: 16px;
            height: 16px;
        }

        /* ---------- Button ---------- */
        .btn-submit {
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s;
            margin-top: 4px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit svg {
            width: 16px;
            height: 16px;
        }

        /* ---------- Footer inside card ---------- */
        .card-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            font-size: 12.5px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px var(--success-soft);
        }

        /* ---------- Page footer ---------- */
        .page-footer {
            padding: 20px 32px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            border-top: 1px solid var(--border);
        }

        .page-footer span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .page-footer .dot {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        @media (max-width: 480px) {
            .topbar {
                padding: 12px 16px;
            }

            .page-footer {
                padding: 16px;
            }

            .brand-tag {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <!-- Top bar -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                </div>
                <div class="brand-text">
                    <span class="brand-name">PrivateNet</span>
                    <span class="brand-tag">v2.4.1</span>
                </div>
            </div>
            <a href="#" class="topbar-link">Need help?</a>
        </header>

        <!-- Main -->
        <main class="content">
            <div class="login-wrap">

                <!-- Header -->
                <div class="login-header">
                    <div class="login-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                    </div>
                    <h1 class="login-title">Sign in to Admin Console</h1>
                    <p class="login-subtitle">Restricted access. Authorized administrators only.</p>
                </div>

                <!-- Card -->
                <div class="card">
                    <form onsubmit="event.preventDefault();">

                        <!-- Username -->
                        <div class="field">
                            <label class="field-label" for="username">Username</label>
                            <div class="input-group">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                        <circle cx="12" cy="7" r="4" />
                                    </svg>
                                </span>
                                <input id="username" type="text" placeholder="Enter your username"
                                    autocomplete="username" />
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="field">
                            <div class="field-label">
                                <label for="password">Password</label>
                                <a href="#" class="field-hint">Forgot password?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="11" width="18" height="11" rx="2" />
                                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                                    </svg>
                                </span>
                                <input id="password" type="password" placeholder="Enter your password"
                                    autocomplete="current-password" />
                                <button type="button" class="input-suffix" aria-label="Show password"
                                    onclick="togglePassword(this)">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                        <circle cx="12" cy="12" r="3" />
                                    </svg>
                                </button>
                            </div>
                        </div>

                        <!-- Submit -->
                        <button type="submit" class="btn-submit">
                            Sign in
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="M5 12h14M12 5l7 7-7 7" />
                            </svg>
                        </button>

                    </form>

                    <div class="card-footer">
                        <span class="status-dot"></span>
                        <span>OpenVPN service operational</span>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer class="page-footer">
            <span>
                PrivateNet Admin · Secure Access
                <span class="dot"></span>
                TLS 1.3 Encrypted
            </span>
        </footer>

    </div>

    <script>
        function togglePassword(btn) {
            const input = btn.parentElement.querySelector('input');
            const isPwd = input.type === 'password';
            input.type = isPwd ? 'text' : 'password';
            btn.setAttribute('aria-label', isPwd ? 'Hide password' : 'Show password');
        }
    </script>
</body>

</html>
